name: QuantumShield PQC Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quantumshield:
    name: QuantumShield Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run QuantumShield tests
        run: |
          python -m unittest discover -s tests -v

      - name: Create output directory
        run: |
          mkdir -p output

      - name: Scan cryptographic assets
        run: |
          python pqcscan.py . --exclude tests --json output/inventory.json

      - name: Analyze quantum risk
        run: |
          python pqcscan.py --risk output/inventory.json

      - name: Generate migration recommendations
        run: |
          python pqcscan.py --recommend output/risk_report.json

      - name: Generate CBOM and SARIF
        run: |
          python pqcscan.py --export all

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: output/results.sarif
          category: quantumshield